<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda</title>

<!-- ====== Supaya bisa "Add to Home Screen" di iPhone dan tampil kayak app ====== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icon-180.png">

<!-- Manifest, biar juga rapi kalau suatu saat dibuka/di-install dari Android/Chrome -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2A20">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ==========================================================
   1. DESIGN TOKENS
   Ganti warna/ukuran di sini kalau mau ubah tampilan global.
   ========================================================== */
:root{
  --paper:        #ECEFE1;   /* warna latar halaman */
  --paper-raised: #F7F8F0;   /* permukaan sedikit lebih terang, buat track tab dsb */
  --card:         #FFFFFF;   /* warna kartu item */
  --ink:          #1C2A20;   /* warna teks utama */
  --ink-soft:     #5C6656;   /* warna teks sekunder */
  --ink-faint:    #99A08C;   /* warna teks/placeholder paling redup */
  --line:         #D9DFC8;   /* warna border tipis */
  --line-strong:  #C1CBA9;   /* border yang sedikit lebih tegas (hover/focus) */

  --primary:      #B85A25;   /* warna aksen utama app (tombol, tab aktif) */
  --primary-dark: #9A4A1D;
  --primary-bg:   #F6E6D3;

  --matkul:     #B85A25;   /* aksen jenis: Matkul (sama dgn primary, jenis paling umum) */
  --matkul-bg:  #F6E6D3;
  --tutor:      #1F6B5B;   /* aksen jenis: Tutor */
  --tutor-bg:   #DCEEE7;
  --lain:       #5B4488;   /* aksen jenis: Lainnya */
  --lain-bg:    #E7E0F3;

  --danger:     #A63C24;   /* warna tombol hapus */
  --danger-bg:  #F7E2D8;

  --shadow-sm: 0 1px 2px rgba(20,28,20,0.05);
  --shadow-md: 0 10px 24px -14px rgba(20,28,20,0.35);
  --shadow-lg: 0 20px 44px -18px rgba(20,28,20,0.4);

  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 22px;

  --ease: cubic-bezier(.4,0,.2,1);
}

*{ box-sizing: border-box; }
*:focus-visible{ outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

body{
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.font-display{
  font-family: "Fraunces", Georgia, "Iowan Old Style", serif;
}


/* ==========================================================
   2. LAYOUT UMUM (header, container)
   ========================================================== */
.wrap{
  max-width: 520px;
  margin: 0 auto;
  padding: 32px 18px 110px; /* padding bawah = ruang buat tombol tambah */
}

header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

h1{
  font-family: "Fraunces", Georgia, "Iowan Old Style", serif;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.015em;
  margin: 0;
}

.today-label{
  font-size: 13px;
  color: var(--ink-soft);
}


/* ==========================================================
   3. TAB HARI (Sen–Min)
   ========================================================== */
.day-tabs{
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 4px 4px 12px;
  margin: 0 -4px 18px;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar{ display: none; }

.day-tab{
  flex: 0 0 auto;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease);
}
.day-tab:active{ transform: scale(0.96); }

.day-tab.active{
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  box-shadow: var(--shadow-sm);
}

/* titik kecil penanda "hari ini", muncul kalau tab itu sedang tidak aktif */
.day-tab.is-today:not(.active)::after{
  content: "";
  position: absolute;
  top: 7px; right: 8px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--primary);
}


/* ==========================================================
   4. TIMELINE JADWAL (vertikal 00-23)
   ========================================================== */
.empty{
  text-align: center;
  padding: 64px 20px;
  color: var(--ink-soft);
}
.empty .big{
  font-family: "Fraunces", Georgia, serif;
  font-size: 20px;
  color: var(--ink);
  margin-bottom: 6px;
}

.timeline{
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  padding-left: 52px;
}

.timeline::before{
  content: "";
  position: absolute;
  left: 44px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--line) 0%, var(--line-strong) 50%, var(--line) 100%);
  border-radius: 2px;
}

.timeline-row{
  display: flex;
  align-items: stretch;
  min-height: 48px;
  position: relative;
  animation: fadeSlideIn .3s var(--ease) backwards;
}

@keyframes fadeSlideIn{
  from{
    opacity: 0;
    transform: translateX(-12px);
  }
  to{
    opacity: 1;
    transform: translateX(0);
  }
}

.timeline-row:nth-child(1){ animation-delay: 0ms; }
.timeline-row:nth-child(2){ animation-delay: 15ms; }
.timeline-row:nth-child(3){ animation-delay: 30ms; }
.timeline-row:nth-child(4){ animation-delay: 45ms; }
.timeline-row:nth-child(5){ animation-delay: 60ms; }
.timeline-row:nth-child(6){ animation-delay: 75ms; }
.timeline-row:nth-child(7){ animation-delay: 90ms; }
.timeline-row:nth-child(8){ animation-delay: 105ms; }
.timeline-row:nth-child(9){ animation-delay: 120ms; }
.timeline-row:nth-child(10){ animation-delay: 135ms; }
.timeline-row:nth-child(11){ animation-delay: 150ms; }
.timeline-row:nth-child(12){ animation-delay: 165ms; }
.timeline-row:nth-child(13){ animation-delay: 180ms; }
.timeline-row:nth-child(14){ animation-delay: 195ms; }
.timeline-row:nth-child(15){ animation-delay: 210ms; }
.timeline-row:nth-child(16){ animation-delay: 225ms; }
.timeline-row:nth-child(17){ animation-delay: 240ms; }
.timeline-row:nth-child(18){ animation-delay: 255ms; }
.timeline-row:nth-child(19){ animation-delay: 270ms; }
.timeline-row:nth-child(20){ animation-delay: 285ms; }
.timeline-row:nth-child(21){ animation-delay: 300ms; }
.timeline-row:nth-child(22){ animation-delay: 315ms; }
.timeline-row:nth-child(23){ animation-delay: 330ms; }
.timeline-row:nth-child(24){ animation-delay: 345ms; }

.timeline-hour{
  position: absolute;
  left: -52px;
  width: 44px;
  text-align: right;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-faint);
  padding-right: 10px;
  font-variant-numeric: tabular-nums;
  top: 0;
  transition: color .2s var(--ease);
}

.timeline-row.has-event .timeline-hour{
  color: var(--ink);
}

.timeline-dot{
  position: absolute;
  left: 40px;
  top: 6px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--line);
  transition: transform .2s var(--ease), background .2s var(--ease);
}

.timeline-row.has-event .timeline-dot{
  transform: scale(1.4);
}

.timeline-row.has-event.tipe-matkul .timeline-dot{ background: var(--matkul); }
.timeline-row.has-event.tipe-tutor  .timeline-dot{ background: var(--tutor); }
.timeline-row.has-event.tipe-lain   .timeline-dot{ background: var(--lain); }

.timeline-content{
  flex: 1;
  padding: 4px 0 12px 20px;
  min-height: 48px;
}

.timeline-event{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 2px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease);
  position: relative;
  overflow: hidden;
}

.timeline-event::before{
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
}

.timeline-event.tipe-matkul::before{ background: var(--matkul); }
.timeline-event.tipe-tutor::before{ background: var(--tutor); }
.timeline-event.tipe-lain::before{ background: var(--lain); }

.timeline-event:hover{
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
}

.timeline-event:active{
  transform: scale(0.98);
}

.event-header{
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.event-title{
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.005em;
}

.event-time{
  font-size: 12px;
  color: var(--ink-soft);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  background: var(--paper-raised);
  padding: 3px 8px;
  border-radius: 6px;
}

.event-tag{
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  margin-top: 6px;
}
.tipe-matkul .event-tag{ background: var(--matkul-bg); color: var(--matkul); }
.tipe-tutor  .event-tag{ background: var(--tutor-bg);  color: var(--tutor); }
.tipe-lain   .event-tag{ background: var(--lain-bg);   color: var(--lain); }

.event-note{
  font-size: 12.5px;
  color: var(--ink-soft);
  margin-top: 6px;
  line-height: 1.4;
}

.event-actions{
  display: flex;
  gap: 12px;
  margin-top: 10px;
  opacity: 0;
  transition: opacity .2s var(--ease);
}

.timeline-event:hover .event-actions{
  opacity: 1;
}

.event-actions button{
  background: none;
  border: none;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  transition: color .15s var(--ease);
}

.event-actions button:hover{
  color: var(--ink);
}

.event-actions button.hapus{ color: var(--danger); }
.event-actions button.hapus:hover{ color: var(--danger); }

.timeline-empty-hour{
  min-height: 48px;
  position: relative;
}

.timeline-empty-hour::after{
  content: "";
  position: absolute;
  left: 20px;
  right: 0;
  top: 50%;
  height: 1px;
  background: var(--line);
  opacity: 0.5;
}


/* ==========================================================
   5. TOMBOL TAMBAH (floating button di bawah layar)
   ========================================================== */
.fab{
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  width: min(484px, calc(100% - 36px));
  padding: 16px 0;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease);
}
.fab:active{ transform: translateX(-50%) scale(0.97); box-shadow: var(--shadow-md); }


/* ==========================================================
   6. FORM TAMBAH/UBAH JADWAL (bottom sheet)
   ========================================================== */
.sheet-backdrop{
  position: fixed;
  inset: 0;
  display: none;
  align-items: flex-end;
  justify-content: center;
  background: rgba(20,28,20,0.42);
  backdrop-filter: blur(2px);
  z-index: 10;
}
.sheet-backdrop.open{
  display: flex;
  animation: fadeIn .18s var(--ease);
}
@keyframes fadeIn{ from{ opacity: 0; } to{ opacity: 1; } }

.sheet{
  width: 100%;
  max-width: 520px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--paper);
  border-radius: 26px 26px 0 0;
  padding: 14px 20px 28px;
  box-shadow: var(--shadow-lg);
  animation: slideUp .22s var(--ease);
}
@keyframes slideUp{ from{ transform: translateY(24px); opacity: 0; } to{ transform: translateY(0); opacity: 1; } }

/* pegangan kecil di atas sheet, penanda visual "bisa di-swipe" */
.sheet::before{
  content: "";
  display: block;
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line-strong);
  margin: 2px auto 16px;
}

.sheet h2{
  font-family: "Fraunces", Georgia, serif;
  font-size: 21px;
  font-weight: 600;
  margin: 0 0 18px;
}

.field{ margin-bottom: 15px; }
.field label{
  display: block;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.field input, .field select, .field textarea{
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  font-family: inherit;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.field input:focus, .field select:focus, .field textarea:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-bg);
}
.field textarea{ resize: vertical; min-height: 58px; }

/* pilihan jenis: Matkul / Tutor / Lainnya, tampil sebagai 3 tombol sejajar */
.tipe-choice{ display: flex; gap: 8px; }
.tipe-choice label{
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 11px 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  margin: 0;
  transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
}
.tipe-choice input{ display: none; } /* radio asli disembunyikan, label-nya yang jadi tombol */
.tipe-choice label.pick-matkul:has(input:checked){ background: var(--matkul-bg); border-color: var(--matkul); color: var(--matkul); }
.tipe-choice label.pick-tutor:has(input:checked) { background: var(--tutor-bg);  border-color: var(--tutor);  color: var(--tutor); }
.tipe-choice label.pick-lain:has(input:checked)  { background: var(--lain-bg);   border-color: var(--lain);   color: var(--lain); }

/* pilihan hari: bisa multi-pilih (checkbox), tampil sebagai chip */
.day-choice{ display: flex; flex-wrap: wrap; gap: 7px; }
.day-choice label{
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
}
.day-choice input{ display: none; }
.day-choice label:has(input:checked){ background: var(--ink); border-color: var(--ink); color: var(--paper); }

.sheet-actions{ display: flex; gap: 10px; margin-top: 20px; }
.sheet-actions button{
  flex: 1;
  padding: 14px 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .12s var(--ease), opacity .12s var(--ease);
}
.sheet-actions button:active{ transform: scale(0.97); }
.btn-simpan{ background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-simpan:disabled{ background: #c7cbba; border-color: #c7cbba; color: #838a76; cursor: not-allowed; }
.btn-batal{ background: transparent; color: var(--ink-soft); }

.loading{ text-align: center; padding: 64px 0; color: var(--ink-soft); font-size: 14px; }


/* ==========================================================
   7. TOMBOL SETTING (API key) DI HEADER
   ========================================================== */
.header-right{ display: flex; align-items: center; gap: 10px; }
.gear-btn{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  width: 32px; height: 32px;
  font-size: 14px;
  cursor: pointer;
  color: var(--ink-soft);
  transition: transform .12s var(--ease);
}
.gear-btn:active{ transform: scale(0.92); }


/* ==========================================================
   8. DUA FAB: AI (atas) & MANUAL (bawah)
   ========================================================== */
.fab-ai{
  background: var(--tutor);
  bottom: 78px;
}
.fab-manual{ }


/* ==========================================================
   9. SEGMENTED CONTROL (dipakai bareng: tab jadwal/materi,
      tab masuk/daftar, tab teks/foto, tab file/link)
   ========================================================== */
.ai-tabs, .view-tabs, .auth-tabs{
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--paper-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 18px;
}
.ai-tab, .materi-type-tab, .view-tab, .auth-tab{
  flex: 1;
  padding: 9px 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
}
.ai-tab.active, .materi-type-tab.active, .view-tab.active, .auth-tab.active{
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.ai-error{
  background: var(--danger-bg);
  color: var(--danger);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 13px;
  margin-bottom: 13px;
}

.hint{ font-size: 12px; color: var(--ink-soft); margin-top: -8px; margin-bottom: 15px; line-height: 1.45; }


/* ==========================================================
   10. SHEET "KONFIRMASI JADWAL" (preview hasil AI)
   ========================================================== */
.preview-item{
  display: flex;
  align-items: flex-start;
  gap: 11px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px;
  margin-bottom: 8px;
  cursor: pointer;
}
.preview-item input{ margin-top: 4px; accent-color: var(--primary); }
.preview-title{ font-size: 14.5px; font-weight: 600; }
.preview-title .item-tag{ margin-left: 6px; vertical-align: middle; }
.preview-detail{ font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }


/* ==========================================================
   11. TAB "JADWAL" / "MATERI"
   (styling gabung ke section 9 — segmented control bersama)
   ========================================================== */
.materi-subject{ cursor: pointer; }


/* ==========================================================
   12. DAFTAR FILE MATERI (di dalam sheet detail matkul/tutor)
   ========================================================== */
.materi-file{
  display: flex;
  align-items: center;
  gap: 11px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 13px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
}
.materi-file-icon{ font-size: 22px; flex-shrink: 0; }
.materi-file-info{ flex: 1; min-width: 0; }
.materi-file-name{ font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.materi-file-date{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.materi-file-actions{ display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; align-items: flex-end; }
.materi-file-actions button{
  background: none;
  border: none;
  padding: 0;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  color: var(--ink-soft);
}
.materi-file-actions button.hapus{ color: var(--danger); }


/* ==========================================================
   13. VIEWER MATERI (tampil di dalam app, bukan tab baru)
   ========================================================== */
.materi-viewer-frame{
  width: 100%;
  height: 58vh;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fff;
}
.materi-viewer-img{ width: 100%; border-radius: var(--radius-sm); display: block; }
.materi-viewer-download{
  display: block;
  text-align: center;
  padding: 13px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  margin-top: 13px;
}
.doc-preview{
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
  max-height: 55vh;
  overflow: auto;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 15px;
}
.doc-preview img{ max-width: 100%; height: auto; }
.excel-preview table{ border-collapse: collapse; width: 100%; font-size: 12px; }
.excel-preview td, .excel-preview th{ border: 1px solid var(--line); padding: 5px 7px; text-align: left; }


/* ==========================================================
   14. LAYAR LOGIN / DAFTAR
   ========================================================== */
#authScreen{

<script>
/* ==========================================================
   1. KONFIGURASI & KONSTANTA
   ========================================================== */
const DAYS      = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];   // label singkat untuk tab
const DAY_NAMES = ["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"]; // label lengkap
const TIPE_LABEL = { matkul: "Matkul", tutor: "Tutor", lain: "Lainnya" };

// backend di-serve dari domain yang sama (Express nyajiin frontend + API),
// jadi path relatif aja, gak perlu tulis domain lengkap
const API_BASE = '';
const TOKEN_KEY = 'agenda:token';
const USERNAME_KEY = 'agenda:username';

function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USERNAME_KEY); }
function getUsername(){ return localStorage.getItem(USERNAME_KEY) || ''; }
function setUsername(u){ localStorage.setItem(USERNAME_KEY, u); }

function authHeader(){
  return { 'Authorization': 'Bearer ' + getToken() };
}

/* wrapper fetch API: otomatis kirim token & lempar error kalau gagal */
async function apiFetch(path, options = {}){
  const opts = { ...options };
  opts.headers = { ...(options.headers || {}), ...authHeader() };

  const res = await fetch(API_BASE + path, opts);

  if (res.status === 401){
    clearToken();
    tampilkanAuthScreen();
    throw new Error('Sesi habis, silakan login ulang.');
  }
  if (!res.ok){
    let pesan = 'Terjadi kesalahan.';
    try { pesan = (await res.json()).error || pesan; } catch (e) {}
    throw new Error(pesan);
  }
  if (res.status === 204) return null;
  return res.json();
}


/* ==========================================================
   2. REFERENSI ELEMEN DOM
   ========================================================== */
const listArea   = document.getElementById('listArea');
const dayTabs     = document.getElementById('dayTabs');
const backdrop     = document.getElementById('backdrop');
const form         = document.getElementById('form');
const dayChoice    = document.getElementById('dayChoice');
const sheetTitle   = document.getElementById('sheetTitle');


/* ==========================================================
   3. STATE APLIKASI
   ========================================================== */
let items = [];                                // semua jadwal, disimpan lokal & ke storage
let selectedDay = getTodayIndex();              // hari yang sedang ditampilkan (0 = Senin)
let editingId = null;                           // id jadwal yang sedang diedit (null = mode tambah)

function getTodayIndex(){
  // Date.getDay() = 0 (Minggu) .. 6 (Sabtu) -> digeser jadi 0 (Senin) .. 6 (Minggu)
  return (new Date().getDay() + 6) % 7;
}


/* ==========================================================
   4. RENDER: tab hari
   ========================================================== */
function renderDayTabs(){
  dayTabs.innerHTML = '';

  DAYS.forEach((label, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab'
      + (i === selectedDay ? ' active' : '')
      + (i === getTodayIndex() ? ' is-today' : '');
    btn.textContent = label;
    btn.onclick = () => {
      selectedDay = i;
      renderDayTabs();
      renderList();
    };
    dayTabs.appendChild(btn);
  });
}


/* ==========================================================
   5. RENDER: daftar jadwal untuk hari yang dipilih
   ========================================================== */
function renderList(){
  const todaysItems = items
    .filter(it => it.days.includes(selectedDay))
    .sort((a, b) => timeToMinutes(a.time) - timeToMinutes(b.time));

  const timeline = buildTimeline(todaysItems);
  listArea.innerHTML = `<div class="timeline">${timeline}</div>`;

  listArea.querySelectorAll('.timeline-event').forEach(eventEl => {
    const id = eventEl.dataset.id;
    const editBtn = eventEl.querySelector('.edit');
    const hapusBtn = eventEl.querySelector('.hapus');
    if (editBtn) editBtn.onclick = (e) => { e.stopPropagation(); openEditSheet(id); };
    if (hapusBtn) hapusBtn.onclick = (e) => { e.stopPropagation(); hapusItem(id); };
    eventEl.onclick = () => openEditSheet(id);
  });
}

function buildTimeline(todaysItems){
  const hourMap = {};
  
  todaysItems.forEach(item => {
    const startMinutes = timeToMinutes(item.time);
    const endMinutes = item.endTime ? timeToMinutes(item.endTime) : startMinutes + 60;
    const startHour = Math.floor(startMinutes / 60);
    const endHour = Math.floor(endMinutes / 60);
    
    for (let h = startHour; h <= endHour; h++){
      if (h >= 0 && h <= 23){
        if (!hourMap[h]) hourMap[h] = [];
        // Masukkan item ke setiap jam yang dilewatinya
        if (!hourMap[h].some(existing => existing.id === item.id)) {
          hourMap[h].push(item);
        }
      }
    }
  });

  let html = '';
  for (let hour = 0; hour < 24; hour++){
    const hourStr = String(hour).padStart(2, '0');
    const events = hourMap[hour] || [];
    const hasEvent = events.length > 0;
    const tipe = hasEvent ? events[0].tipe : '';
    
    html += `
      <div class="timeline-row ${hasEvent ? 'has-event' : ''} ${hasEvent ? 'tipe-' + tipe : ''}">
        <div class="timeline-hour">${hourStr}</div>
        <div class="timeline-dot"></div>
        <div class="timeline-content">
          ${hasEvent ? events.map(renderTimelineEvent).join('') : '<div class="timeline-empty-hour"></div>'}
        </div>
      </div>`;
  }
  
  return html;
}

function renderTimelineEvent(item){
  const duration = item.endTime ? 
    `${item.time}–${item.endTime}` : 
    item.time;
  
  return `
    <div class="timeline-event tipe-${item.tipe}" data-id="${item.id}">
      <div class="event-header">
        <div class="event-title">${escapeHtml(item.title)}</div>
        <div class="event-time">${duration}</div>
      </div>
      <span class="event-tag">${TIPE_LABEL[item.tipe]}</span>
      ${item.note ? `<div class="event-note">${escapeHtml(item.note)}</div>` : ''}
      <div class="event-actions">
        <button class="edit">Ubah</button>
        <button class="hapus">Hapus</button>
      </div>
    </div>`;
}




/* ==========================================================
   6. HELPER
   ========================================================== */
function timeToMinutes(t){
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function escapeHtml(text){
  // mencegah isi input user dianggap sebagai tag HTML
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}


/* ==========================================================
   7. FORM: buka/tutup sheet tambah & ubah
   ========================================================== */
function buildDayChoiceCheckboxes(selectedDays){
  dayChoice.innerHTML = '';
  DAY_NAMES.forEach((name, i) => {
    const isChecked = selectedDays && selectedDays.includes(i);
    const label = document.createElement('label');
    label.innerHTML = `
      <input type="checkbox" value="${i}" ${isChecked ? 'checked' : ''}>
      <span>${DAYS[i]}</span>`;
    dayChoice.appendChild(label);
  });
}

function openAddSheet(){
  editingId = null;
  sheetTitle.textContent = 'Jadwal baru';
  form.reset();
  buildDayChoiceCheckboxes([selectedDay]); // default: hari yang lagi dibuka
  backdrop.classList.add('open');
}

function openEditSheet(id){
  const it = items.find(x => x.id === id);
  if (!it) return;

  editingId = id;
  sheetTitle.textContent = 'Ubah jadwal';
  document.getElementById('fTitle').value = it.title;
  document.getElementById('fTime').value = it.time;
  document.getElementById('fEndTime').value = it.endTime || '';
  document.getElementById('fNote').value = it.note || '';
  form.querySelector(`input[name="tipe"][value="${it.tipe}"]`).checked = true;
  buildDayChoiceCheckboxes(it.days);

  backdrop.classList.add('open');
}

function closeSheet(){
  backdrop.classList.remove('open');
}


/* ==========================================================
   8. CRUD DATA + PENYIMPANAN (window.storage)
   ========================================================== */
async function loadItems(){
  try {
    items = await apiFetch('/api/items');
  } catch (err) {
    console.error(err);
    items = [];
  }
  renderDayTabs();
  renderList();
}

async function hapusItem(id){
  try {
    await apiFetch(`/api/items/${id}`, { method: 'DELETE' });
    items = items.filter(x => x.id !== id);
    renderList();
  } catch (err){
    alert(err.message || 'Gagal menghapus jadwal.');
  }
}

async function simpanForm(event){
  event.preventDefault();

  const title = document.getElementById('fTitle').value.trim();
  const time  = document.getElementById('fTime').value;
  const endTime = document.getElementById('fEndTime').value; // opsional
  const note  = document.getElementById('fNote').value.trim();
  const tipe  = form.querySelector('input[name="tipe"]:checked').value;
  const days  = Array.from(dayChoice.querySelectorAll('input:checked')).map(el => Number(el.value));

  if (!title || !time || days.length === 0) return; // validasi sederhana

  const payload = { title, time, endTime, note, tipe, days };

  try {
    if (editingId){
      const updated = await apiFetch(`/api/items/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const it = items.find(x => x.id === editingId);
      Object.assign(it, updated);
    } else {
      const created = await apiFetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      items.push(created);
    }

    closeSheet();
    renderList();
  } catch (err){
    alert(err.message || 'Gagal menyimpan jadwal.');
  }
}


/* ==========================================================
   10. FITUR "TAMBAH VIA AI" (teks bebas atau foto -> jadwal)
   ========================================================== */
const APIKEY_KEY = "agenda:apiKey";

function getApiKey(){ return localStorage.getItem(APIKEY_KEY) || ''; }
function setApiKey(key){ localStorage.setItem(APIKEY_KEY, key); }

document.getElementById('apiKeyBtn').onclick = () => {
  const current = getApiKey();
  const input = window.prompt(
    'Masukkan Google Gemini API key kamu (gratis, bikin di aistudio.google.com/apikey). Disimpan hanya di browser ini:',
    current
  );
  if (input !== null) setApiKey(input.trim());
};

const aiBackdrop   = document.getElementById('aiBackdrop');
const aiTeksInput  = document.getElementById('aiTeksInput');
const aiFotoInput  = document.getElementById('aiFotoInput');
const aiError      = document.getElementById('aiError');
const aiProsesBtn  = document.getElementById('aiProsesBtn');
let aiMode = 'teks';

document.getElementById('openAiBtn').onclick = () => {
  aiTeksInput.value = '';
  aiFotoInput.value = '';
  aiError.style.display = 'none';
  switchAiMode('teks');
  aiBackdrop.classList.add('open');
};
document.getElementById('aiCancelBtn').onclick = () => aiBackdrop.classList.remove('open');
aiBackdrop.onclick = (e) => { if (e.target === aiBackdrop) aiBackdrop.classList.remove('open'); };

document.querySelectorAll('.ai-tab').forEach(tab => {
  tab.onclick = () => switchAiMode(tab.dataset.mode);
});

function switchAiMode(mode){
  aiMode = mode;
  document.querySelectorAll('.ai-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('aiTeksPane').style.display = mode === 'teks' ? '' : 'none';
  document.getElementById('aiFotoPane').style.display = mode === 'foto' ? '' : 'none';
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showAiError(msg){
  aiError.textContent = msg;
  aiError.style.display = 'block';
}

function setAiLoading(isLoading){
  aiProsesBtn.disabled = isLoading;
  aiProsesBtn.textContent = isLoading ? 'Memproses…' : 'Proses dengan AI';
}

const AI_SYSTEM_PROMPT = `Kamu mengubah informasi jadwal (dari teks atau foto) menjadi data terstruktur.
Balas HANYA dengan JSON array yang valid, tanpa teks lain, tanpa markdown code fence.
Setiap elemen array berbentuk:
{"title": string, "tipe": "matkul"|"tutor"|"lain", "time": "HH:MM", "endTime": "HH:MM atau string kosong", "days": [angka 0-6], "note": string}
Keterangan days: 0=Senin, 1=Selasa, 2=Rabu, 3=Kamis, 4=Jumat, 5=Sabtu, 6=Minggu.
"time" adalah jam mulai, "endTime" adalah jam selesai kalau disebutkan (mis. "8 - 9 40" artinya time "08:00", endTime "09:40"). Kalau jam selesai tidak disebutkan, endTime = "".
Kalau satu kegiatan yang sama muncul di beberapa hari dengan jam sama, gabungkan jadi satu elemen dengan beberapa angka di "days".
Kalau tidak yakin tipenya, pakai "lain". Kalau tidak ada catatan tambahan, note = "".
Kalau tidak ada jadwal yang bisa dibaca dari input, balas dengan [].`;

async function prosesAI(){
  aiError.style.display = 'none';

  let key = getApiKey();
  if (!key){
    key = window.prompt('Masukkan Google Gemini API key kamu dulu (gratis, dari aistudio.google.com/apikey):');
    if (!key) return;
    setApiKey(key.trim());
    key = getApiKey();
  }

  let parts;
  if (aiMode === 'teks'){
    const teks = aiTeksInput.value.trim();
    if (!teks){ showAiError('Tulis dulu jadwalnya ya.'); return; }
    parts = [{ text: teks }];
  } else {
    const file = aiFotoInput.files[0];
    if (!file){ showAiError('Pilih foto dulu ya.'); return; }
    const base64 = await fileToBase64(file);
    parts = [
      { inline_data: { mime_type: file.type || 'image/jpeg', data: base64 } },
      { text: 'Ini foto jadwalnya, tolong dibaca.' }
    ];
  }

  setAiLoading(true);
  try {
    const model = 'gemini-3.6-flash';
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key);

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: AI_SYSTEM_PROMPT }] },
        contents: [{ role: 'user', parts }],
        generationConfig: { responseMimeType: 'application/json' }
      })
    });

    if (!response.ok){
      const errText = await response.text();
      let pesan = errText;
      try {
        const errJson = JSON.parse(errText);
        pesan = (errJson.error && errJson.error.message) ? errJson.error.message : errText;
      } catch (e) { /* biarkan pesan mentah kalau bukan JSON */ }
      throw new Error('(' + response.status + ') ' + pesan);
    }

    const data = await response.json();
    const teksHasil = data.candidates
      && data.candidates[0]
      && data.candidates[0].content
      && data.candidates[0].content.parts
      && data.candidates[0].content.parts[0]
      && data.candidates[0].content.parts[0].text;

    if (!teksHasil) throw new Error('Tidak ada balasan teks dari AI.');

    const cleaned = teksHasil.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(cleaned);

    const hasil = (Array.isArray(parsed) ? parsed : [])
      .map(p => ({
        title: String(p.title || '').trim(),
        tipe: ['matkul','tutor','lain'].includes(p.tipe) ? p.tipe : 'lain',
        time: /^\d{2}:\d{2}$/.test(p.time || '') ? p.time : '00:00',
        endTime: /^\d{2}:\d{2}$/.test(p.endTime || '') ? p.endTime : '',
        days: Array.isArray(p.days) ? p.days.filter(d => Number.isInteger(d) && d >= 0 && d <= 6) : [],
        note: String(p.note || '').trim()
      }))
      .filter(it => it.title && it.days.length > 0);

    if (hasil.length === 0){
      showAiError('AI tidak menemukan jadwal yang bisa dibaca. Coba tulis/foto yang lebih jelas.');
      return;
    }

    aiParsedItems = hasil;
    aiBackdrop.classList.remove('open');
    openPreviewSheet();

  } catch (err){
    console.error(err);
    showAiError(err.message || 'Terjadi kesalahan saat memproses. Coba lagi.');
  } finally {
    setAiLoading(false);
  }
}

/* ==========================================================
   11. FITUR "MATERI" (per matkul/tutor: upload/lihat/hapus file & link)
   Disimpan di server (backend), jadi sinkron di semua device.
   ========================================================== */
const MATERI_ICON  = { pdf: '📄', excel: '📊', word: '📝', foto: '🖼️', link: '🔗', lain: '📁' };
const MATERI_LABEL = { pdf: 'PDF', excel: 'Excel', word: 'Word', foto: 'Foto', link: 'Link', lain: 'File' };

let currentSubject = null; // subject yang lagi dibuka di sheet detail materi

async function getMateriBySubject(subjectKey){
  return apiFetch(`/api/materi?subjectKey=${encodeURIComponent(subjectKey)}`);
}

async function getMateriCounts(){
  const semua = await apiFetch('/api/materi');
  const counts = {};
  semua.forEach(m => { counts[m.subjectKey] = (counts[m.subjectKey] || 0) + 1; });
  return counts;
}

async function deleteMateriEntry(id){
  return apiFetch(`/api/materi/${id}`, { method: 'DELETE' });
}

function detectFileType(file){
  const name = (file.name || '').toLowerCase();
  const mime = file.type || '';
  if (mime.includes('pdf') || name.endsWith('.pdf')) return 'pdf';
  if (mime.includes('spreadsheet') || name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv')) return 'excel';
  if (mime.includes('word') || name.endsWith('.docx') || name.endsWith('.doc')) return 'word';
  if (mime.startsWith('image/')) return 'foto';
  return 'lain';
}

function formatTanggalUpload(iso){
  const d = new Date(iso);
  const tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  return `${tgl}, ${jam}`;
}

/* daftar matkul/tutor unik, diambil dari jadwal yang sudah ada */
function getUniqueSubjects(){
  const map = new Map();
  items
    .filter(it => it.tipe === 'matkul' || it.tipe === 'tutor')
    .forEach(it => {
      const key = it.title.trim().toLowerCase();
      if (!map.has(key)) map.set(key, { key, title: it.title.trim(), tipe: it.tipe });
    });
  return Array.from(map.values()).sort((a, b) => a.title.localeCompare(b.title));
}

async function renderMateriList(){
  const materiListArea = document.getElementById('materiListArea');
  const subjects = getUniqueSubjects();

  if (subjects.length === 0){
    materiListArea.innerHTML = `
      <div class="empty">
        <div class="big">Belum ada matkul/tutor</div>
        Tambahkan jadwal matkul atau tutor dulu di tab Jadwal.
      </div>`;
    return;
  }

  const counts = await getMateriCounts();

  materiListArea.innerHTML = `
    <div class="list">
      ${subjects.map(s => `
        <div class="item tipe-${s.tipe} materi-subject" data-key="${escapeHtml(s.key)}">
          <div class="bar"></div>
          <div class="item-body">
            <div class="item-top">
              <div class="item-title">${escapeHtml(s.title)}</div>
            </div>
            <span class="item-tag">${TIPE_LABEL[s.tipe]}</span>
            <div class="item-note">${counts[s.key] || 0} materi</div>
          </div>
        </div>`).join('')}
    </div>`;

  materiListArea.querySelectorAll('.materi-subject').forEach(el => {
    const subject = subjects.find(s => s.key === el.dataset.key);
    el.onclick = () => openMateriDetail(subject);
  });
}

async function openMateriDetail(subject){
  currentSubject = subject;
  document.getElementById('materiDetailTitle').textContent = subject.title;
  const list = await getMateriBySubject(subject.key);
  renderMateriFileList(list);
  materiDetailBackdrop.classList.add('open');
}

function renderMateriFileList(list){
  const container = document.getElementById('materiFileList');

  if (list.length === 0){
    container.innerHTML = `<div class="empty" style="padding:24px 10px;">Belum ada materi.<br>Tap "Tambah Materi" buat upload.</div>`;
    return;
  }

  container.innerHTML = list.map(m => `
    <div class="materi-file" data-id="${m.id}">
      <div class="materi-file-icon">${MATERI_ICON[m.type] || '📁'}</div>
      <div class="materi-file-info">
        <div class="materi-file-name">${escapeHtml(m.fileName)}</div>
        <div class="materi-file-date">${MATERI_LABEL[m.type] || 'File'} · diunggah ${formatTanggalUpload(m.uploadedAt)}</div>
      </div>
      <div class="materi-file-actions">
        <button class="lihat">Lihat</button>
        <button class="hapus">Hapus</button>
      </div>
    </div>`).join('');

  container.querySelectorAll('.materi-file').forEach(row => {
    const m = list.find(x => x.id === row.dataset.id);
    row.querySelector('.lihat').onclick  = () => lihatMateri(m);
    row.querySelector('.hapus').onclick = () => hapusMateri(m.id);
  });
}

function urlFileMateri(id){
  // token lewat query param karena <iframe>/<img> src gak bisa kirim header Authorization
  return `${API_BASE}/api/materi/${id}/file?token=${encodeURIComponent(getToken())}`;
}

async function lihatMateri(m){
  if (m.type === 'link'){
    window.open(m.url, '_blank');
    return;
  }

  document.getElementById('materiViewerTitle').textContent = m.fileName;
  document.getElementById('materiViewerBody').innerHTML = '<div class="loading">Memuat…</div>';
  materiViewerBackdrop.classList.add('open');

  const body = document.getElementById('materiViewerBody');
  const namaAman = escapeHtml(m.fileName);
  const fileUrl = urlFileMateri(m.id);
  const tombolDownload = `<a class="materi-viewer-download" href="${fileUrl}" download="${namaAman}">Download file ini</a>`;

  if (m.type === 'pdf'){
    body.innerHTML = `<iframe class="materi-viewer-frame" src="${fileUrl}"></iframe>${tombolDownload}`;

  } else if (m.type === 'foto'){
    body.innerHTML = `<img class="materi-viewer-img" src="${fileUrl}" alt="${namaAman}">${tombolDownload}`;

  } else if (m.type === 'word'){
    try {
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.2/mammoth.browser.min.js');
      const res = await fetch(fileUrl, { headers: authHeader() });
      const arrayBuffer = await res.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      body.innerHTML = `<div class="doc-preview">${result.value}</div>${tombolDownload}`;
    } catch (err){
      console.error(err);
      body.innerHTML = `<div class="hint">Preview isi Word gagal dimuat. Download dulu aja ya.</div>${tombolDownload}`;
    }

  } else if (m.type === 'excel'){
    try {
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const res = await fetch(fileUrl, { headers: authHeader() });
      const arrayBuffer = await res.arrayBuffer();
      const wb = XLSX.read(arrayBuffer, { type: 'array' });
      const html = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);
      body.innerHTML = `<div class="doc-preview excel-preview">${html}</div>${tombolDownload}`;
    } catch (err){
      console.error(err);
      body.innerHTML = `<div class="hint">Preview isi Excel gagal dimuat. Download dulu aja ya.</div>${tombolDownload}`;
    }

  } else {
    body.innerHTML = `<div class="hint">Preview belum bisa ditampilkan buat tipe file ini. Download dulu, lalu buka pakai aplikasi yang sesuai.</div>${tombolDownload}`;
  }
}

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload  = () => resolve();
    s.onerror = () => reject(new Error('Gagal memuat pustaka preview.'));
    document.head.appendChild(s);
  });
}

function tutupMateriViewer(){
  materiViewerBackdrop.classList.remove('open');
}

const materiViewerBackdrop = document.getElementById('materiViewerBackdrop');
document.getElementById('materiViewerCloseBtn').onclick = tutupMateriViewer;
materiViewerBackdrop.onclick = (e) => { if (e.target === materiViewerBackdrop) tutupMateriViewer(); };

async function hapusMateri(id){
  await deleteMateriEntry(id);
  const list = await getMateriBySubject(currentSubject.key);
  renderMateriFileList(list);
  renderMateriList();
}

const materiDetailBackdrop = document.getElementById('materiDetailBackdrop');
document.getElementById('materiDetailCloseBtn').onclick = () => materiDetailBackdrop.classList.remove('open');

/* ---------- Sheet: tambah materi baru (file / link) ---------- */
const materiUploadBackdrop = document.getElementById('materiUploadBackdrop');
let materiUploadMode = 'file';

document.getElementById('openMateriUploadBtn').onclick = () => {
  document.getElementById('materiFileInput').value = '';
  document.getElementById('materiLinkLabel').value = '';
  document.getElementById('materiLinkUrl').value = '';
  document.getElementById('materiUploadError').style.display = 'none';
  switchMateriUploadMode('file');
  materiUploadBackdrop.classList.add('open');
};
document.getElementById('materiUploadCancelBtn').onclick = () => materiUploadBackdrop.classList.remove('open');
materiUploadBackdrop.onclick = (e) => { if (e.target === materiUploadBackdrop) materiUploadBackdrop.classList.remove('open'); };

document.querySelectorAll('.materi-type-tab').forEach(tab => {
  tab.onclick = () => switchMateriUploadMode(tab.dataset.mode);
});

function switchMateriUploadMode(mode){
  materiUploadMode = mode;
  document.querySelectorAll('.materi-type-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('materiFilePane').style.display = mode === 'file' ? '' : 'none';
  document.getElementById('materiLinkPane').style.display = mode === 'link' ? '' : 'none';
}

document.getElementById('materiUploadSaveBtn').onclick = async () => {
  const errEl = document.getElementById('materiUploadError');
  errEl.style.display = 'none';

  try {
    const formData = new FormData();
    formData.append('subjectKey', currentSubject.key);
    formData.append('subjectName', currentSubject.title);

    if (materiUploadMode === 'file'){
      const file = document.getElementById('materiFileInput').files[0];
      if (!file){ errEl.textContent = 'Pilih file dulu ya.'; errEl.style.display = 'block'; return; }
      formData.append('mode', 'file');
      formData.append('file', file);
    } else {
      const url = document.getElementById('materiLinkUrl').value.trim();
      if (!url){ errEl.textContent = 'Isi link-nya dulu ya.'; errEl.style.display = 'block'; return; }
      const label = document.getElementById('materiLinkLabel').value.trim();
      formData.append('mode', 'link');
      formData.append('url', url);
      formData.append('label', label);
    }

    await apiFetch('/api/materi', { method: 'POST', body: formData });

    materiUploadBackdrop.classList.remove('open');
    const list = await getMateriBySubject(currentSubject.key);
    renderMateriFileList(list);
    renderMateriList();

  } catch (err){
    console.error(err);
    errEl.textContent = err.message || 'Gagal menyimpan materi. Coba lagi.';
    errEl.style.display = 'block';
  }
};

/* ---------- Tab "Jadwal" / "Materi" ---------- */
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.onclick = () => switchView(tab.dataset.view);
});

function switchView(view){
  document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  document.getElementById('jadwalView').style.display = view === 'jadwal' ? '' : 'none';
  document.getElementById('materiView').style.display = view === 'materi' ? '' : 'none';

}

/* ==========================================================
   15. AUTENTIKASI (login / daftar / logout)
   ========================================================== */
const authScreen   = document.getElementById('authScreen');
const authForm     = document.getElementById('authForm');
const authError    = document.getElementById('authError');
const authSubmitBtn = document.getElementById('authSubmitBtn');
let authMode = 'login';

document.querySelectorAll('.auth-tab').forEach(tab => {
  tab.onclick = () => {
    authMode = tab.dataset.mode;
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === authMode));
    authSubmitBtn.textContent = authMode === 'login' ? 'Masuk' : 'Daftar';
    authError.style.display = 'none';
  };
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  authError.style.display = 'none';

  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value;

  authSubmitBtn.disabled = true;
  try {
    const res = await fetch(`/api/auth/${authMode === 'login' ? 'login' : 'register'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok){
      authError.textContent = data.error || 'Gagal, coba lagi.';
      authError.style.display = 'block';
      return;
    }

    setToken(data.token);
    setUsername(data.username);
    tampilkanApp();

  } catch (err){
    console.error(err);
    authError.textContent = 'Gagal terhubung ke server.';
    authError.style.display = 'block';
  } finally {
    authSubmitBtn.disabled = false;
  }
});

document.getElementById('logoutBtn').onclick = () => {
  clearToken();
  tampilkanAuthScreen();
};

function tampilkanAuthScreen(){
  authScreen.style.display = 'flex';
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('openAiBtn').style.display = 'none';
  document.getElementById('openAddBtn').style.display = 'none';
}

function tampilkanApp(){
  authScreen.style.display = 'none';
  document.getElementById('appWrap').style.display = '';
  document.getElementById('usernameLabel').textContent = getUsername();
  switchView('jadwal');
  loadItems();
}

// cek status login pas halaman dibuka
if (getToken()){
  tampilkanApp();
} else {
  tampilkanAuthScreen();
}
